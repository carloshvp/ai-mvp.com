<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Governed Embodied Agent Lab demo run</title>
  <desc id="description">A controlled move executes, a restricted move requires human approval, execution continues after restart, approval replay is blocked, and the evidence chain verifies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101416"/>
      <stop offset="1" stop-color="#293136"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="58" rx="22" fill="#20262a"/>
  <rect x="0" y="36" width="1200" height="22" fill="#20262a"/>
  <circle cx="34" cy="29" r="7" fill="#5b6469"/>
  <circle cx="58" cy="29" r="7" fill="#5b6469"/>
  <circle cx="82" cy="29" r="7" fill="#5b6469"/>
  <text x="600" y="35" text-anchor="middle" fill="#9aa1a0" font-family="SFMono-Regular, Consolas, monospace" font-size="15">governed-agent demo</text>

  <text x="48" y="102" fill="#fcfcf8" font-family="SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700">Governed Embodied Agent Lab</text>
  <line x1="48" y1="122" x2="1152" y2="122" stroke="#3a4247"/>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="48" y="164" fill="#d8dbd9">1. Observe workspace</text>
    <text x="470" y="164" fill="#fcfcf8" font-weight="700">EXECUTED</text>
    <text x="670" y="164" fill="#8a928f">observe-workspace</text>

    <text x="48" y="207" fill="#d8dbd9">2. Enter controlled zone</text>
    <text x="470" y="207" fill="#fcfcf8" font-weight="700">EXECUTED</text>
    <text x="670" y="207" fill="#8a928f">approved-zone</text>

    <text x="48" y="250" fill="#d8dbd9">3. Request restricted move</text>
    <text x="470" y="250" fill="#fcfcf8" font-weight="700">APPROVAL REQUIRED</text>
    <text x="730" y="250" fill="#8a928f">restricted-zone</text>

    <text x="48" y="293" fill="#d8dbd9">4. Human approval issued</text>
    <text x="470" y="293" fill="#fcfcf8" font-weight="700">ACTION + CONTEXT BOUND</text>

    <text x="48" y="336" fill="#d8dbd9">5. Execute after restart</text>
    <text x="470" y="336" fill="#fcfcf8" font-weight="700">EXECUTED</text>
    <text x="670" y="336" fill="#8a928f">evidence continued</text>

    <text x="48" y="379" fill="#d8dbd9">6. Replay same approval</text>
    <text x="470" y="379" fill="#fcfcf8" font-weight="700">BLOCKED</text>
    <text x="670" y="379" fill="#8a928f">token already consumed</text>

    <text x="48" y="422" fill="#d8dbd9">7. Verify evidence chain</text>
    <text x="470" y="422" fill="#fcfcf8" font-weight="700">VERIFIED</text>
    <text x="670" y="422" fill="#8a928f">17 linked records</text>
  </g>

  <rect x="48" y="458" width="1104" height="1" fill="#3a4247"/>
  <text x="48" y="493" fill="#7a8280" font-family="SFMono-Regular, Consolas, monospace" font-size="15">Policy default: deny  |  Identity required  |  Approval: one use  |  Ledger: SHA-256 chain</text>
</svg>
